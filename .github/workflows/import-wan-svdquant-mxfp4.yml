name: One-shot import Wan SVDQuant MXFP4

on:
  push:
    branches:
      - agent/import-wan-svdquant-mxfp4
    paths:
      - .github/workflows/import-wan-svdquant-mxfp4.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-wan-svdquant-mxfp4
          fetch-depth: 0

      - name: Extract upstream SVDQuant and MXFP4 reference
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO="https://github.com/CGCL-codes/Wan2.2-I2V-A14B-W4A4.git"
          UPSTREAM_COMMIT="a49a935677c7f760ef368cd334801416fff5aaa3"
          DEST="third_party/wan2_2_i2v_svdquant_mxfp4"
          WORK="${RUNNER_TEMP}/wan2_2_i2v_w4a4"

          rm -rf "${WORK}" "${DEST}"
          git clone --filter=blob:none --no-checkout "${UPSTREAM_REPO}" "${WORK}"
          git -C "${WORK}" checkout "${UPSTREAM_COMMIT}"

          files=(
            configs/wan_i2v_w4a4_mxfp4.yaml
            quant/mxfp4.py
            quant/quant_linear.py
            quant/gptq.py
            quant/wan_smooth.py
            quant/act_policy.py
            quant/replace.py
            quant/eval_hooks.py
            quant/calibrate_wan_i2v.py
            quant/export_mxfp4.py
            tools/calibrate_wan_dit_smooth.py
            tools/dit_ptq.py
            tools/ptq_wan_i2v_opens2v_svdquant.py
            tools/infer_wan_i2v_svdquant.py
            tools/generate_vbench_i2v_svdquant.py
          )

          for file in "${files[@]}"; do
            test -f "${WORK}/${file}" || { echo "Missing upstream file: ${file}" >&2; exit 1; }
          done

          mkdir -p "${DEST}"
          (
            cd "${WORK}"
            cp --parents "${files[@]}" "${GITHUB_WORKSPACE}/${DEST}"
          )
          cp "${WORK}/LICENSE.txt" "${DEST}/LICENSE.txt"
          cp "${WORK}/README.md" "${DEST}/UPSTREAM_README.md"

          cat > "${DEST}/README.md" <<'EOF'
          # Wan2.2 I2V SVDQuant / MXFP4 upstream extract

          This directory vendors the SVDQuant / MXFP4-related implementation extracted from:

          - Upstream repository: `CGCL-codes/Wan2.2-I2V-A14B-W4A4`
          - Upstream ref: `main`
          - Snapshot commit: `a49a935677c7f760ef368cd334801416fff5aaa3`
          - License: Apache License 2.0 (`LICENSE.txt`)

          Files copied from upstream under `quant/`, `tools/`, and `configs/` are kept unmodified. The local README, manifest, and minimal package `__init__.py` files only document and isolate the extract.

          ## Included mechanisms

          - OCP-style MXFP4 weight and activation QDQ;
          - direct-code GPTQ for MXFP4;
          - SVDQuant low-rank residual branches;
          - SmoothQuant-like activation-to-weight outlier migration;
          - online Hessian collection;
          - activation policy support for Wan high/low-noise experts;
          - offline PTQ construction, inference, and VBench-I2V generation entry points.

          ## Runtime boundary

          This is **not a standalone Wan2.2 copy**. The scripts still require the upstream `wan` package, Wan checkpoints, schedulers, VAE/T5 code, and external calibration/evaluation assets.

          The public upstream snapshot references `tools.msvd_wan_i2v_dataset` from two calibration scripts, but that module is not present in the repository. This unresolved dependency is recorded in `SOURCE_MANIFEST.json`.

          No model weights, PTQ artifacts, datasets, generated videos, or evaluation results are included.

          ## Recommended HiF4 migration order

          1. Treat `quant/mxfp4.py` as the format-backend reference and replace its codebook, scaling, packing, and dequantization with the existing native HiF4 backend.
          2. Reuse the structure of `quantize_linear_weight_groupwise_gptq`, while emitting native HiF4 codes directly rather than applying RTN after GPTQ.
          3. Preserve the state split in `QuantLinear`: format metadata, `smooth_scale`, activation policy, and optional low-rank branch.
          4. Reuse `GPTQHessianCollector`; when Smooth is enabled, transform the Hessian as `H_s = D^{-1} H D^{-1}`.
          5. Add MagR outside this vendor directory as an independent pre-transform before RTN/GPTQ.

          Keep this directory as an auditable upstream reference. Apache-2.0 requires prominent notices in any upstream files that are modified later.
          EOF

          cat > "${DEST}/quant/__init__.py" <<'EOF'
          """Package wrapper for the vendored Wan2.2 SVDQuant/MXFP4 reference.

          This file is local to HiF4_Sp. Upstream source modules are unmodified;
          see ../SOURCE_MANIFEST.json for provenance.
          """

          from .gptq import GPTQHessianCollector
          from .quant_linear import QuantLinear, QuantLinearWithBranch

          __all__ = ["GPTQHessianCollector", "QuantLinear", "QuantLinearWithBranch"]
          EOF

          cat > "${DEST}/tools/__init__.py" <<'EOF'
          """CLI entry points vendored from the Wan2.2 SVDQuant/MXFP4 reference."""
          EOF

          python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path("third_party/wan2_2_i2v_svdquant_mxfp4")
          upstream = pathlib.Path("${RUNNER_TEMP}/wan2_2_i2v_w4a4")
          copied = [
              "configs/wan_i2v_w4a4_mxfp4.yaml",
              "quant/mxfp4.py",
              "quant/quant_linear.py",
              "quant/gptq.py",
              "quant/wan_smooth.py",
              "quant/act_policy.py",
              "quant/replace.py",
              "quant/eval_hooks.py",
              "quant/calibrate_wan_i2v.py",
              "quant/export_mxfp4.py",
              "tools/calibrate_wan_dit_smooth.py",
              "tools/dit_ptq.py",
              "tools/ptq_wan_i2v_opens2v_svdquant.py",
              "tools/infer_wan_i2v_svdquant.py",
              "tools/generate_vbench_i2v_svdquant.py",
          ]
          records = []
          for path in copied:
              sha = subprocess.check_output(
                  ["git", "-C", str(upstream), "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              records.append({"source": path, "destination": path, "blob_sha": sha})
          payload = {
              "schema_version": 1,
              "upstream": {
                  "repository": "CGCL-codes/Wan2.2-I2V-A14B-W4A4",
                  "ref": "main",
                  "snapshot_commit": "a49a935677c7f760ef368cd334801416fff5aaa3",
                  "license": "Apache-2.0",
              },
              "copied_unmodified": records,
              "renamed_unmodified": [
                  {"source": "README.md", "destination": "UPSTREAM_README.md"},
                  {"source": "LICENSE.txt", "destination": "LICENSE.txt"},
              ],
              "local_files": ["README.md", "SOURCE_MANIFEST.json", "quant/__init__.py", "tools/__init__.py"],
              "known_unresolved_upstream_dependencies": [
                  {
                      "module": "tools.msvd_wan_i2v_dataset",
                      "referenced_by": ["quant/calibrate_wan_i2v.py", "tools/calibrate_wan_dit_smooth.py"],
                      "status": "not present at the public upstream snapshot",
                  }
              ],
          }
          (root / "SOURCE_MANIFEST.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

          rm -f .github/workflows/import-wan-svdquant-mxfp4.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "vendor Wan2.2 SVDQuant MXFP4 reference"
          git push origin HEAD:agent/import-wan-svdquant-mxfp4
